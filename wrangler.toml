name = "satyam-residency-website"
main = "server.js"
compatibility_date = "2024-10-01"

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "hotelsatyamdatabase"
database_id = "a1475244-fe5a-4e91-b223-0de557ef455b"

[ai]
binding = "AI"

[triggers]
crons = ["0 2 * * *"]

[vars]
NODE_ENV = "production"
HOTEL_NAME = "Satyam Residency"
HOTEL_PHONE = "+918984938388"
CURRENCY = "INR"
WHATSAPP_VERIFY_TOKEN = "satyam_concierge_webhook_2026"

# Use wrangler secret put ADMIN_PASSWORD instead of storing it here